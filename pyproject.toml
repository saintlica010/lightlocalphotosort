[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-media-curator"
version = "0.1.0"
description = "Lightweight local-first photo and video curator"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
]

[project.scripts]
local-media-curator = "local_media_curator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
